# =============================================================================
# [[schedule]] — recurring turns, fired by the bridge itself
# =============================================================================
#
# The bridge runs these on its own. No desktop app has to be open, no GUI account
# has to be signed in, and no cron or launchd job is involved: the always-on
# service that answers your phone is the thing that fires them.
#
# WHY IT IS BUILT LIKE THIS. The jobs this replaced lived in a desktop scheduler
# that silently stopped firing, and nobody noticed for a month. So:
#
#   * every due job ends with an outcome — ran, failed or skipped — and a skip
#     ALWAYS says why;
#   * each of those is logged, recorded in <state-dir>/schedule.json, and pushed
#     to the phone (see `notify`);
#   * GET /jesse/schedule answers "did the morning routine run today, and how
#     long did it take" in ONE authenticated request. Use it. That is the whole
#     point of the endpoint:
#         curl -sH "authorization: Bearer $JESSE_TOKEN" \
#              http://127.0.0.1:8765/jesse/schedule | jq
#
# CHAINS, NOT A LIST OF CLOCK TIMES. These jobs all write the same working tree,
# so two of them overlapping produces real conflicts. Rather than spacing them at
# wall-clock times and hoping the estimates hold — estimates rot, and the day a
# job runs long is the day you get a conflict — a job hangs off another with
# `after` and starts only once that job's turn has FULLY completed.
#
# At most ONE scheduled turn runs at any moment, across every chain. If a second
# chain's head comes due while another chain is running, it waits; if it is still
# waiting when its `catch_up_secs` expires it is skipped and recorded. A scheduled
# turn also yields to YOU: if the request concurrency limit is saturated by turns
# from the app, it waits briefly and then skips rather than queueing behind you.
#
# Each fire is a fresh conversation and a normal turn — it lands in the job store
# with a job id, retries and fails exactly like a phone turn, and is retrievable
# at GET /jesse/result/{id} (the schedule endpoint reports that id as
# `last_job_id`, and the push carries it so the tap opens the finished turn).
#
# ---------------------------------------------------------------------------
# The keys
# ---------------------------------------------------------------------------
#
#   id             REQUIRED, unique, stable. It is the state key and the handle
#                  `after` refers to, so renaming one forgets its history. Two
#                  entries sharing an id is a STARTUP ERROR (which one is
#                  "nightly"? — the intent is unknowable).
#   enabled        default true. `false` keeps the entry and stops it firing. A
#                  disabled job breaks an `after_on = "success"` chain behind it,
#                  which is the documented meaning of switching one off.
#   at             LOCAL wall-clock "HH:MM". A job with `at` is a chain HEAD.
#                  DST is handled properly: on the spring-forward day a time that
#                  does not exist fires when the clock jumps past it (02:30 runs
#                  at 03:00) rather than being silently skipped, and on the
#                  fall-back day a time that happens twice fires exactly once.
#   after          the `id` of another job. A job with `after` is a chain LINK: it
#                  fires when that job finishes, never at a clock time.
#                  EXACTLY ONE of `at` / `after` is required. Both, or neither,
#                  disables that entry (and only that entry). A cycle in the
#                  `after` graph is a STARTUP ERROR that prints the cycle.
#   after_on       "success" (default) | "any". With "success" the link does not
#                  run if its predecessor failed, was skipped, or was disabled,
#                  and the whole rest of that chain is recorded as skipped naming
#                  the job that broke it. With "any" it runs regardless — for the
#                  report or cleanup step you most want when the step before it
#                  went wrong. Only valid on a link.
#   days           weekday names, default all seven ("mon".."sun", or full names).
#                  Applies to HEADS AND LINKS alike, so a link can be narrower
#                  than its head — a Monday-only job hanging off a daily chain.
#                  A CHAIN IS ONE OCCURRENCE: every member's `days` is evaluated
#                  against the instant the HEAD came due, not against the clock
#                  at the moment the chain reaches that member. A chain that
#                  starts at 23:50, or that runs late after an outage, must not
#                  judge its last link against tomorrow.
#                  Every job's resolved days are printed in the boot table, so a
#                  `days` key on the wrong entry is visible at startup.
#   prompt         inline text for the turn, OR
#   prompt_file    a path to a file holding it. Exactly one is required.
#                  A RELATIVE path resolves against the vault root; an absolute
#                  path is used as given. It is READ AT FIRE TIME and never
#                  cached, so editing a prompt needs no restart. A missing or
#                  unreadable file at fire time is a FAILED run carrying that
#                  reason — never a crash, never a silently empty turn.
#   mode           "tell" (default) | "ask" — the same modes a normal turn takes.
#                  Scheduled work usually acts, hence the default.
#   timeout_secs   per-job override of the global per-turn run limit
#                  (JESSE_TIMEOUT), still clamped to the same hard ceiling. For
#                  the one long job in a chain of short ones.
#   notify         default true — push the outcome to the phone. A failure or an
#                  unexpected skip pushes with its reason named; a chain that
#                  breaks pushes ONCE for the break, not once per skipped link.
#                  Two things deliberately do not push (they are what you asked
#                  for, not news): a link skipped by its own `days` filter, and a
#                  disabled entry. Set false to silence a job entirely — but note
#                  that silence is exactly the failure this feature exists to fix.
#   catch_up_secs  default 3600. HEADS ONLY (a link has no clock to be late
#                  against; setting it on one disables that entry). If the host
#                  was asleep or the service was down when the job was due, it
#                  still runs when the service comes back — provided the delay is
#                  within this window. Past it, the run is SKIPPED and the skip
#                  records how late it was. Raise it for a job worth running
#                  late; lower it for one that is worthless off its hour.
#
#                  IT ALSO BOUNDS A RETRY. If a fire is skipped because the
#                  bridge was momentarily busy serving YOU (every model slot
#                  taken by app turns), that is not a stale occurrence — nothing
#                  about it went out of date, the bridge was just busy — so it
#                  stays eligible and the next tick runs it, for as long as it is
#                  inside this window. A transient collision costs minutes, not
#                  the day's run. Past the window it is skipped for good, with
#                  the delay named. Only a chain HEAD retries: replaying a chain
#                  whose earlier members already succeeded would redo their work.
#                  A pending retry shows up as `retry_due_ms` on
#                  GET /jesse/schedule.
#   expect_output  OPTIONAL list of vault-relative globs this job is expected to
#                  WRITE, e.g. ["Inbox/{date}-vault-lint.md"]. Heads and links
#                  alike. Paths resolve under <vault>/vault/ (the notes dir) and
#                  one that could leave it — `..`, absolute, `~` — disables that
#                  entry at validation rather than silently never matching at
#                  03:00. Tokens {date} (YYYY-MM-DD), {year}, {month}, {day}
#                  expand from the OCCURRENCE in the scheduler's zone. Globbing
#                  is `*` and `?` within one path segment; there is no `**`.
#
#                  IT CHANGES THE OUTCOME IN BOTH DIRECTIONS. Before the fire: if
#                  anything matching is already at or after this occurrence, the
#                  fire is skipped with reason "output fresh" (quiet — it is the
#                  config working), which is what makes a catch-up run after an
#                  outage idempotent. After the fire: if nothing matching is at or
#                  after THIS fire, the outcome is `fired-no-output` rather than
#                  `ran` — pushed, ledgered, counted toward the failure streak,
#                  and NOT a success, so it breaks an `after_on = "success"`
#                  chain. A turn that talked to the model and wrote nothing is
#                  not a job that did its work.
#   model          OPTIONAL registry id (anything GET /jesse/models lists), e.g.
#                  "glm-5.2". Validated AT LOAD — a typo disables that entry by
#                  name instead of failing one turn a night later. It backs only
#                  this job's turns and never touches the global active model.
#                  Unset uses whatever is globally active.
#   profiles       which AWAY PROFILES this job is in scope for. Default both,
#                  i.e. `["home", "away"]`, so every entry written before this key
#                  existed is untouched by it. Heads and links alike, exactly like
#                  `days`. An unknown name, or an empty list (a job that can never
#                  fire is a typo, not an intention), disables that entry by name.
#
#                  DECLARING IT IS HOW A JOB OPTS OUT. `profiles = ["home"]` on
#                  the work-week status report means that report does not run
#                  while you are away — and the members BEHIND it in the chain
#                  still do. This is the one way in which it differs from
#                  `enabled = false`, and the difference is deliberate: disabling
#                  a job says "do not run THIS", and a chain stopping there is
#                  what you asked for; excluding it by profile says "this does not
#                  APPLY this fortnight", so the member is simply absent and
#                  everything behind it consults the job it would have followed.
#                  The skip is recorded (reason "not scheduled under this
#                  profile") and never pushed — it is the config working.
#
#                  Each job's resolved profiles are printed in the boot table and
#                  reported on GET /jesse/schedule, beside the active profile.
#
# A misconfiguration never takes the bridge down. An entry that fails validation
# (both or neither of `at`/`after`, an unknown `after` target, `catch_up_secs` on
# a link, an unparseable time or weekday, an unrecognized key) is logged with its
# id, disabled ON ITS OWN, and listed under `invalid` on GET /jesse/schedule —
# while every other job still runs. Only a duplicate id and an `after` cycle
# refuse to start, because both make your intent unknowable.
#
# A HEAD whose `prompt_file` does not exist at load is disabled the same way —
# and its FIRST LINK IS PROMOTED into the clock slot it vacated, inheriting the
# head's `at`, `catch_up_secs` and `days` and reporting `promoted_from` on the
# endpoint. A retired job whose prompt was deleted otherwise fails every single
# night while the chain behind it runs on `after_on = "any"`, which is exactly
# how one sat in a live config for six days unnoticed. A LINK with a missing
# prompt is unchanged: it fails at fire time, which costs one turn rather than a
# chain's start.
#
# YOU DO NOT NEED TO RESTART TO EDIT THIS TABLE. The bridge stats this file every
# tick and reloads the `[[schedule]]` array when it changes (POST
# /jesse/schedule/reload does it on demand). Only this array is reloaded —
# everything else stays as booted. A file that does not validate KEEPS THE
# RUNNING SCHEDULE and pushes the first error, so a typo cannot silently retire
# your jobs. Per-job records are kept by id across the swap.
#
# =============================================================================
# [profile] — the away profile's one schedule-level key
# =============================================================================
#
# The AWAY PROFILE is runtime state, not config: you set it from the phone with
# POST /jesse/profile and it EXPIRES BY ITSELF. It does exactly three things and
# knows nothing else about what "away" means —
#
#   * it moves the zone every date is derived in (the scheduler's "HH:MM", the
#     app-completed stamps, the diet page's default day, the prompt's clock line);
#   * it takes the `profiles`-excluded jobs above out of the schedule;
#   * it adds ONE line to every prompt, which your vault's own prompts branch on:
#
#         PROFILE: home
#         PROFILE: away (Europe/London) until 2026-09-07, note: Scotland
#
# Set it, and come back, like this:
#
#   curl -sX POST http://127.0.0.1:8765/jesse/profile \
#        -H "authorization: Bearer $JESSE_TOKEN" \
#        -H 'content-type: application/json' \
#        -d '{"name":"away","tz":"Europe/London",
#             "until":"2026-09-07T23:59:00+01:00","note":"Scotland"}'
#
#   curl -sX POST http://127.0.0.1:8765/jesse/profile \
#        -H "authorization: Bearer $JESSE_TOKEN" \
#        -H 'content-type: application/json' -d '{"name":"home"}'
#
# `away` REQUIRES a valid IANA zone and a FUTURE `until`. Neither is a formality:
# a zone the tz database does not know would leave the bridge reporting "away"
# while quietly deriving host-zone dates, and an unbounded profile is a bridge
# left in the wrong zone until somebody notices — the failure mode of a manual
# switch is forgetting to switch back.
#
#   on_return      OPTIONAL job id. When an away period ENDS — you post `home`,
#                  or `until` passes, whether the bridge was running at the time
#                  or asleep — that job's chain is fired ONCE, on the same path
#                  POST /jesse/schedule/{id}/fire uses. The turn's prompt carries
#                  an extra line under the PROFILE one:
#
#                      RETURN: first day back after 13 days away
#
#                  It fires exactly once, and the fact that it has fired is on
#                  disk, so a restart does not replay it. Name a job that exists;
#                  one that does not is reported under `invalid` on
#                  GET /jesse/schedule rather than refusing the boot.

# [profile]
# on_return = "morning-brief"

# ---------------------------------------------------------------------------
# Worked example 1 — an overnight chain: one head, three links
# ---------------------------------------------------------------------------
#
# Head at 02:30 local, then three jobs each waiting for the one before it. The
# third is Fridays only, so on any other day it is skipped (and its own tail with
# it) while the rest of the chain runs normally.

# [[schedule]]
# id = "overnight-tidy"                  # the chain HEAD
# at = "02:30"                           # local wall clock
# prompt_file = "prompts/overnight-tidy.md"
# catch_up_secs = 7200                   # still worth running up to 2h late
#
# [[schedule]]
# id = "overnight-index"                 # runs when overnight-tidy has FINISHED
# after = "overnight-tidy"
# prompt_file = "prompts/overnight-index.md"
#
# [[schedule]]
# id = "overnight-digest"
# after = "overnight-index"
# prompt_file = "prompts/overnight-digest.md"
#
# [[schedule]]
# id = "overnight-archive"               # the weekly one, on a daily chain
# after = "overnight-digest"
# days = ["fri"]
# prompt_file = "prompts/overnight-archive.md"
#
# [[schedule]]
# id = "overnight-work-status"           # pointless while you are away…
# after = "overnight-archive"
# profiles = ["home"]
# prompt_file = "prompts/overnight-work-status.md"
#
# [[schedule]]
# id = "overnight-wrapup"                # …and this still runs when it is absent
# after = "overnight-work-status"
# prompt_file = "prompts/overnight-wrapup.md"

# ---------------------------------------------------------------------------
# Worked example 2 — a morning chain anchored to a real-world event
# ---------------------------------------------------------------------------
#
# The head's `at` is chosen to line up with something in the world (here: the
# household's alarm, so the briefing is ready when the phone is picked up). Its
# catch-up window is short on purpose — a "good morning" briefing delivered at
# lunchtime is worse than one that visibly did not run, and the skip says so.
#
# The last link is the long one: a weekly deep pass that needs far more than the
# global per-turn limit, so it names its own. It runs on `after_on = "any"` so a
# failure earlier in the chain does not cost you the weekly pass as well.

# [[schedule]]
# id = "morning-brief"                   # anchored to the 06:45 alarm
# at = "06:45"
# days = ["mon", "tue", "wed", "thu", "fri"]
# prompt_file = "prompts/morning-brief.md"
# catch_up_secs = 900                    # 15 min: after that it is not "morning"
#
# [[schedule]]
# id = "morning-inbox"
# after = "morning-brief"
# prompt_file = "prompts/morning-inbox.md"
# mode = "tell"                          # the default; shown for completeness
#
# [[schedule]]
# id = "weekly-deep-pass"                # the long one
# after = "morning-inbox"
# after_on = "any"                       # run it even if the inbox pass failed
# days = ["mon"]
# prompt_file = "prompts/weekly-deep-pass.md"
# timeout_secs = 5400                    # 90 min, well past the usual turn limit
# notify = true                          # the default; this one you want to hear


# ---------------------------------------------------------------------------
# [direct] — the vault settings every `harness = "direct"` turn runs under
# ---------------------------------------------------------------------------
#
# ONE TABLE, NOT PER-MODEL KEYS, because it describes the VAULT rather than a model: every
# direct model on this deployment reads the same documents with the same exclusions and the
# same cold list, and per-model copies would be a way for two models to disagree about which
# documents exist.
#
# ABSENT IS THE SHIPPED POSTURE and it is deliberately conservative: no exclusions beyond the
# agent layer's own built-in list, no cold documents, NO FETCH ALLOWLIST AT ALL (so the
# `fetch_url` tool appears in the manifest at `read` and refuses every URL), and the built-in
# grep index. A deployment that writes nothing here gets a harness that can read and search
# its vault and reach nothing outside it.
#
# [direct]
# # Paths never listed, read, searched or written, on top of the built-in list (which already
# # covers `.git`, the artifact staging directories, and the bridge's own state). A trailing
# # `/` matches a directory and everything under it.
# exclude = ["_to-purge/", "Ops-Notes/secrets/"]
#
# # COLD documents: listable by title, unreadable, unsearchable, unwritable. The split from
# # `exclude` is the point — an excluded document answers exactly as an absent one does, while
# # a cold one is visibly there and visibly refused. Use `exclude` for what the assistant has
# # no business knowing exists, and `cold_prefixes` for what the owner can see in their own
# # vault and would notice being denied.
# cold_prefixes = ["Private/", "Medical/"]
#
# # Hosts `fetch_url` may reach. EMPTY BY DEFAULT — every URL is refused, and that is not a
# # placeholder. `*.example.com` matches the domain and its subdomains; a bare `*` means any
# # host and has to be typed deliberately.
# fetch_allow = ["docs.rs", "*.wikipedia.org"]
#
# # Search with `qmd` rather than the built-in grep index. Needs the collection name too: qmd
# # reports a hit as `qmd://<collection>/<path>` and the wrong prefix produces ids that resolve
# # to the wrong documents or to none, so it is required rather than guessed. With `qmd = true`
# # and no collection the bridge warns once and falls back to grep.
# qmd = true
# qmd_collection = "vault"
#
# # Per-turn ceilings, overriding the agent layer's defaults. The WALL clock is not here: it is
# # JESSE_TIMEOUT, so the loop stops itself just before the driver would cut it off and the
# # user gets a partial answer with a reason rather than a bare 504.
# max_iterations = 24
# max_tool_calls = 60

# ---------------------------------------------------------------------------
# Two `direct` models, one per wire the harness drives
# ---------------------------------------------------------------------------
#
# Same three fields every other model takes — base_url, model, auth_token_env — plus
# `harness = "direct"` and the wire. NOTHING about a direct model is configured in a new
# place; the harness key is the only thing that changes.
#
# Anthropic Messages, straight at the vendor. `auth_scheme` is omitted because the per-host
# default is already `x-api-key` for this host, which is Anthropic's documented scheme.
# Arm it with: ANTHROPIC_API_KEY=...
# [[models]]
# id = "sonnet-direct"
# label = "Sonnet (direct)"
# kind = "hosted"                              # hosting: a provider endpoint
# wire = "messages"                            # implied by kind, spelled out for contrast
# base_url = "https://api.anthropic.com"       # the host; the adapter appends /v1/messages
# model = "claude-sonnet-4-6"
# auth_token_env = "ANTHROPIC_API_KEY"
# harness = "direct"
# level = "read"                               # the safe default; raise deliberately
# price = { in_per_m = 3.00, cached_per_m = 0.30, out_per_m = 15.00 }
#
# OpenAI Chat Completions, on Fireworks' OpenAI-compatible root. NOTE THE `/v1`: it is the
# API ROOT the adapter appends `/chat/completions` to, where the Anthropic-surface entry
# above takes a bare host. The quirks block is what a non-OpenAI host serving an
# OpenAI-shaped API usually needs.
# Arm it with: FIREWORKS_API_KEY=...
# [[models]]
# id = "glm-direct"
# label = "GLM (direct)"
# kind = "hosted"
# wire = "chat"                                # /chat/completions, not /v1/messages
# base_url = "https://api.fireworks.ai/inference/v1"   # the API ROOT
# model = "accounts/fireworks/models/glm-5p2"
# auth_token_env = "FIREWORKS_API_KEY"
# harness = "direct"
# level = "read"
# thinking = "off"                             # the default; this host rejects the field
# price = { in_per_m = 0.55, cached_per_m = 0.55, out_per_m = 2.19 }
# [models.quirks]
# reasoning_effort_supported = false           # already the default off api.openai.com
# strict_tools = false                         # ditto; spelled out because this host rejects it
