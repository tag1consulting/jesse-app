# jesse.example.toml — the personalization template.
#
# Copy this to `jesse.local.toml` and edit it to make Jesse yours. The bridge
# reads it LAST, layering it over the built-in generic defaults; environment
# variables (JESSE_OWNER_NAME, …) override the file. A fresh clone with no
# jesse.local.toml works fine — the assistant just addresses "the user".
#
# `jesse.local.toml` is gitignored BY DESIGN so your personal data can never be
# pushed. Do NOT edit this example with real values — edit your copy.
#
# Where the bridge looks for the file (first one that exists wins):
#   1. $JESSE_CONFIG            — an explicit path to a TOML file
#   2. ./jesse.local.toml       — repo root / current working directory
#   3. <state-dir>/jesse.local.toml
#        where <state-dir> is $JESSE_STATE_DIR, else $HOME/.jesse-bridge
#      (the reliable spot for a launchd-managed service whose cwd isn't the repo).

[persona]

# How the assistant refers to you in the prompt wrappers. Rendered into the
# built-in Ask/Tell framing wherever it says "{owner}"/"{Owner}". Default:
# "the user" (so a fresh clone reads "The user is ASKING you a question…").
owner_name = "Alex Example"

# Your POSSESSIVE pronoun ("their"/"his"/"her"/…), rendered wherever the wrappers
# say "{owner_pronoun} phone" / "{owner_pronoun} permission". Optional; default
# "their" (which reads correctly for any name).
owner_pronoun = "their"

# The languages you write in (informational; e.g. English + Spanish). Not injected
# into any prompt — it documents the deployment and pairs with the extra diet
# vocabulary below. Optional; default ["en"].
languages = ["en", "es"]

# Extra diet-intent keywords merged into the ENGLISH-only baseline diet gate
# (whole lowercased tokens). This is where a non-English or personal food/exercise
# vocabulary lives, so no personal or non-English term is baked into the shipped
# source. Optional; default [] (English baseline only). Examples below are
# Spanish diet terms — replace with your own language/vocabulary.
diet_keywords_extra = [
  "desayuno",   # breakfast
  "almuerzo",   # lunch
  "cena",       # dinner
  "comida",     # meal / food
  "caminata",   # walk
  "corri",      # ran
  "peso",       # weight
]

# =============================================================================
# offload_order — which models serve work you did NOT choose a model for
# =============================================================================
#
# ONE ordered list, replacing the four per-role backends (JESSE_TITLE_*, JESSE_DIET_*,
# JESSE_VAULTQA_*) that each named a model for one call site. Those said WHERE a job ran
# and, by implication, how much it was trusted. This says what a job REQUIRES and lets
# config say which models can meet it.
#
# THE RULE. For a job requiring capability C, walk this list in order and take the first
# model that is configured, healthy, and at level C or above. If none qualifies, use the
# conversation's model; if that cannot meet C either, use the ambient default.
#
#   titles, diet extraction .... require basic
#   vault Q&A .................. requires read
#   diet verification .......... requires WRITE, and EXCLUDES the model that served the
#                                extraction — `write` is the same trust threshold that
#                                skips verification entirely, so without the exclusion the
#                                first cheap model in the list would verify its own work
#                                and silently delete the property the gate provides.
#
# Whether an extraction is verified at all is now the EXTRACTING model's level: at
# `write` the output is taken as-is, below it the hosted verdict is mandatory and
# blocking. (This uses the level as a deliberate PROXY for extraction accuracy; they are
# not the same property, but it is visible in config rather than implied by deployment.)
# `JESSE_DIET_PROBATION` was deleted along with the role backends.
#
# THIS NEVER GOVERNS A MAIN TURN. The bridge does not auto-switch a conversation off an
# unhealthy model — answering as a silently different model is worse than surfacing the
# failure — so a main turn runs on the model the chip selected or it fails. Failover here
# walks to the next candidate on a TRANSPORT failure only, never on a refusal or a bad
# answer, which are answers rather than outages.
#
# Absent or empty (the default) → every such job goes to the ambient default, which is
# byte-for-byte the behavior before this key existed.
#
# offload_order = ["local", "glm-5.2"]

# =============================================================================
# [[models]] — the global model switch's registry (declarative, operator-configurable)
# =============================================================================
#
# The set of models the CONVERSATION can be switched onto (from the phone or the Mac).
# The registry is MERGED from three sources, later overriding earlier BY ID:
#   1. the built-in ambient `opus` — ALWAYS present, needs no config, is never
#      configurable here, and is byte-for-byte today's behavior (normal allowlist,
#      writes-on). A bridge with NO model config is opus-only.
#   2. the legacy `JESSE_MODEL_GLM_* / _KIMI_* / _LOCAL_*` env triples (still supported).
#   3. these `[[models]]` entries.
#
# `glm-5.2`, `kimi-k3` and `kimi-k3-codex` DEFAULT their base_url + slug to the live
# Fireworks values, so each is armed by exporting ONE var — `JESSE_MODEL_GLM_AUTH_TOKEN` /
# `JESSE_MODEL_KIMI_AUTH_TOKEN`. `local` has no defaults: all three vars are required.
#
# KIMI K3 IS REGISTERED TWICE, ON PURPOSE, and the two are not one model in two costumes:
#   * `kimi-k3`        — the ANTHROPIC surface (`/v1/messages`) on a claude-code child,
#                        contained by the tool allowlist + strict MCP recorded in
#                        bridge/containment.toml.
#   * `kimi-k3-codex`  — the OPENAI surface (`/v1/responses`) on a real `codex exec` child,
#                        contained by the OS sandbox recorded in
#                        bridge/containment-codex.toml, reaching the vault via the shell.
# K3 is natively an OpenAI-style model, so the Codex entry is the RECOMMENDED path for it;
# the Anthropic entry stays first-class. `JESSE_MODEL_KIMI_AUTH_TOKEN` (one Fireworks key)
# arms BOTH — set `JESSE_MODEL_KIMI_CODEX_AUTH_TOKEN` to give them separate keys.
# Both default decks are overridable per model via `JESSE_MODEL_<NAME>_PRICE_{IN,CACHED,OUT}`.
#
# Adding a model is a PURE CONFIG EDIT here plus ONE env var for its token — no bridge
# code change. Each model is health-probed on an interval; the apps only offer a model
# that is CONFIGURED (its token env var is set) AND HEALTHY (its last probe passed).
#
# Fields (id, kind, base_url, model are REQUIRED; the rest are optional):
#   id             stable key the switch persists (e.g. "fireworks", "codex")
#   label          shown in the app switcher (defaults to id)
#   kind           WHICH API SURFACE the base_url serves ("ambient" is reserved for the
#                  built-in opus):
#                    hosted  an Anthropic `/v1/messages` endpoint, hosted by a provider
#                    local   an Anthropic-compatible endpoint on this machine
#                    openai  an OpenAI RESPONSES endpoint (`/v1/responses`), driven by a
#                            harness that speaks it — today that is `harness = "codex"`.
#                            Pairing `openai` with a harness that speaks Anthropic is a
#                            STARTUP ERROR naming the model: it would otherwise probe
#                            healthy and 404 on every turn.
#   base_url       the base URL of that surface. For hosted/local, the Anthropic base (the
#                  bridge appends /v1/messages). For openai, the OpenAI API ROOT — the
#                  segment BEFORE /responses (e.g. https://api.fireworks.ai/inference/v1).
#   model          the backend model id
#   subagent_model model for the subagents the turn spawns (defaults to `model`)
#   auth_token_env the NAME of the env var holding the token — NEVER the token itself.
#                  The token is read from the process env at startup; an unset var makes
#                  the model configured-but-unarmed (it appears in the list, disabled,
#                  until the var is set). No token is ever written to this file, to
#                  model.json, or to any endpoint response.
#   harness        the agent program that runs this model's child ("claude-code", "codex").
#                  Absent means "claude-code". An id no harness is registered under is a
#                  STARTUP ERROR naming the model, never a silent fallback. Each harness
#                  has one binary-path env var (claude-code: JESSE_CLAUDE_BIN, codex:
#                  JESSE_CODEX_BIN) which is consulted, and only fatal, for a harness some
#                  configured model uses.
#
#                  THE HARNESS BOUNDS THE LEVEL, and not every harness has every level.
#                  A harness declares which levels it can EXPRESS, and a level it cannot
#                  express is a startup error saying "cannot express" rather than "failed a
#                  gate" — the two send an operator looking in different places. Codex has
#                  no `basic`: its containment lever is an OS sandbox mode, not a tool
#                  allowlist, and there is no config key that removes its shell, so its
#                  weakest posture is byte-identical to `read`. `harness = "codex"` with
#                  `level = "basic"` therefore refuses to start.
#   level          the MOST this model may be granted: "basic" | "read" | "write".
#                  Absent means "read" — the safe direction: a newly declared model can
#                  be asked questions but cannot change anything.
#                    basic  jobs needing no tools at all (titles, diet extraction)
#                    read   may also read and search the vault
#                    write  may also change the vault
#                  The level is a CEILING, not a grant: the JOB sets the actual grant
#                  beneath it. A `write` model serving a title runs at `basic`; a `read`
#                  model backing a conversation gets the read-only posture.
#                  It is validated at STARTUP against the committed containment record
#                  (bridge/containment.toml): a level whose harness has no passing
#                  battery row refuses to start, naming the highest level that passed.
#                  There is NO per-model writes toggle — `default_writes` was removed and
#                  a leftover key is a startup error. What a model may touch is config,
#                  not something a phone can change.
#
#                  WHAT `level` DOES NOT BOUND, so "read" is not read as "nothing can
#                  happen": it bounds the TOOLS the model is granted. It does not bound the
#                  DIRECTIVE CHANNEL — the bridge parses a directive off the final line of a
#                  reply and acts on it itself, so a model at any level can still cause the
#                  effects that channel allows. Those effects are deliberately ungated and
#                  are narrower than they sound: NO vault mutation at all, and Apple Health
#                  writes/retractions on the phone behind six validation stages with no
#                  partial application. The full enumeration — every effect, and what stands
#                  between the model's output and each one — is the comment block above
#                  `Directives` in `bridge/src/directives.rs`. Read it before assuming a
#                  read-only model is inert.
#
#                  SUGGESTED ASSIGNMENT (guidance, not a compiled-in default):
#                    Claude models .......... write
#                    Codex models ........... write
#                    Kimi 3, GLM ............ write
#                    locally hosted models .. read
#   price          { in_per_m, cached_per_m, out_per_m } dollars per 1M tokens (default
#                  0/0/0), feeding the per-turn cost badge.
#   health         { path, interval_secs, timeout_secs } — probe endpoint + cadence
#                  (defaults: 60s, 3s, and a path that FOLLOWS THE KIND —
#                  "/v1/messages" for hosted/local, "/chat/completions" for openai).
#                  A probe that gets 401/403 (bad/expired token), 404 (path/model not
#                  served), or a 5xx marks the model UNHEALTHY (hidden from the
#                  switcher); 400/422/429 stay healthy.
#                  An `openai` model probes the CHAT path even though its turns run on
#                  /responses: the one-token probe body is valid on both contracts, so
#                  the chat path answers 200 with a real completion instead of a 400 the
#                  classifier would merely tolerate. Same host, key and model, so a
#                  passing probe still speaks for the turn.
#                  A THINKING model needs a wider timeout than 3s — it emits reasoning
#                  before its first token even at max_tokens 1. Kimi K3 on Fireworks was
#                  measured at 1.2–5.4s (2026-08-04), so its entry sets 15.
#
# JESSE_HEALTH_INTERVAL_SECS (env var, optional): a GLOBAL override for the DEFAULT probe
#   interval, so an operator can probe idle configured models less often without writing a
#   full [[models]] block. Seconds, floored at 5; a zero/unparseable value is ignored with
#   a startup warning. Priority per model, highest first: an explicit per-model
#   health.interval_secs (below) > JESSE_HEALTH_INTERVAL_SECS > the built-in 60s default.
#   Applies to the env-triple models (glm-5.2, kimi-k3, local) and any [[models]] entry
#   that omits its own interval_secs. Does NOT change the per-probe timeout or path.
#
# TWO WAYS TO REACH AN OPENAI-SHAPED MODEL, and they are not interchangeable:
#
#   1. `kind = "openai"` + `harness = "codex"` — the model's OWN endpoint, driven by the
#      Codex agent loop. No gateway. This is the direct path and it is what a tool-using
#      OpenAI-style model needs: driving a tool loop through an Anthropic-compatibility
#      shim is where those models fail. REQUIRES the provider to serve the OpenAI
#      **Responses API** (`/v1/responses`) — codex-cli 0.146.0 removed `wire_api = "chat"`,
#      so a provider offering only `/v1/chat/completions` cannot be driven this way at all.
#      Note what changes with it: a Codex-harness model reaches the vault through the SHELL
#      under an OS sandbox, not through the qmd MCP allowlist, and is governed by
#      `bridge/containment-codex.toml`.
#
#   2. `kind = "hosted"` pointed at a small Anthropic-surface GATEWAY that translates
#      /v1/messages to the model's native API. Keeps the model on the Claude Code harness
#      and its MCP allowlist. Fine for chat; the tool loop is the part that suffers.
#
# Either way `auth_token_env` names an env var — never a literal token. On path 1 the key
# is handed to the child in its ENVIRONMENT, never as a command-line argument, so it does
# not appear in `ps` output or in a recorded argv.
#
# The examples below are COMMENTED OUT (uncomment + set the token env var to enable one):

# A hosted provider (fireworks.ai) served on its Anthropic surface. Arm it by exporting
# the named token in the bridge's launch env: FIREWORKS_API_KEY=fw-...
# [[models]]
# id = "fireworks"
# label = "Fireworks GLM"
# kind = "hosted"
# base_url = "https://api.fireworks.ai/inference"
# model = "accounts/fireworks/models/glm-5p2"
# auth_token_env = "FIREWORKS_API_KEY"
# level = "write"                          # GLM: trusted with the vault
# harness = "claude-code"                  # the default; shown here for completeness
# price = { in_per_m = 1.40, cached_per_m = 0.14, out_per_m = 4.40 }
# health = { path = "/v1/messages", interval_secs = 60, timeout_secs = 3 }

# An OpenAI-style "codex" model run through the ANTHROPIC-SURFACE GATEWAY, on the
# claude-code harness. Its native API is `/v1/chat/completions`, so base_url points at a
# small translating gateway (running here on :8900), NOT at OpenAI. This is the older of
# the two ways to reach Codex and needs no `harness` key, because the child really is a
# claude-code child talking to a gateway.
# Arm it with: CODEX_GATEWAY_TOKEN=...
# [[models]]
# id = "codex"
# label = "Codex"
# kind = "hosted"
# base_url = "http://127.0.0.1:8900"       # the Anthropic-surface gateway, not OpenAI
# model = "gpt-5-codex"
# subagent_model = "gpt-5-mini"            # cheaper model for spawned subagents
# auth_token_env = "CODEX_GATEWAY_TOKEN"
# level = "write"                          # Codex: trusted with the vault
# price = { in_per_m = 1.25, cached_per_m = 0.13, out_per_m = 10.00 }
# health = { interval_secs = 30, timeout_secs = 3 }

# ANY OpenAI-style model, on its OWN endpoint, through the Codex harness — no gateway.
# Kimi K3 on Fireworks is the worked example (verified live 2026-08-04): `kind = "openai"`
# makes the three fields below LOAD-BEARING (they are inert for a Codex model on its own
# subscription login), and the harness turns them into the child's provider definition.
#
# Adding another OpenAI-style model is this block again with different values, plus one env
# var for its token. Two requirements on the provider:
#   * it serves the Responses API at <base_url>/responses, and
#   * it serves /chat/completions for the health probe (or set health.path explicitly).
#
# `kimi-k3-codex` IS NOW A BUILT-IN ENTRY and needs no block here at all: exporting
# `JESSE_MODEL_KIMI_AUTH_TOKEN` arms it exactly as it arms its Anthropic-surface sibling.
# The block below is what that built-in is EQUIVALENT TO — write it out only to override a
# field (a different slug, its own key, `level = "write"`, a different deck).
#
# NOTE THE `/v1` ON base_url. It is the API ROOT the codex harness appends `/responses` to,
# where the Anthropic-surface sibling's base_url is a host claude-code appends
# `/v1/messages` to. Swapping the two yields a model that is armed, correct-looking and
# permanently unreachable.
#
# [[models]]
# id = "kimi-k3-codex"
# label = "Kimi K3 (Codex)"
# kind = "openai"                              # /v1/responses, not /v1/messages
# base_url = "https://api.fireworks.ai/inference/v1"   # the API ROOT, before /responses
# model = "accounts/fireworks/models/kimi-k3"
# auth_token_env = "JESSE_MODEL_KIMI_AUTH_TOKEN"
# harness = "codex"                            # required: only codex speaks this surface
# level = "read"                               # `write` also passes — see the block below
# price = { in_per_m = 3.00, cached_per_m = 0.30, out_per_m = 15.00 }
# health = { timeout_secs = 15 }               # K3 thinks; 3s would mark it unhealthy

# The SAME model on the CODEX HARNESS, at `write` — a real `codex exec` child rather than a
# claude-code child behind a gateway. No gateway, no translation: the bridge runs the codex
# CLI directly off its own subscription login (`codex login`, whose credential the harness
# copies into a fresh per-turn CODEX_HOME).
#
# WHAT `level = "write"` BUYS AND WHAT IT DOES NOT. It puts the child in Codex's
# `workspace-write` sandbox with `writable_roots` scoped to the turn's working directory and
# nothing else, so writes outside the vault are refused BY THE OPERATING SYSTEM — including
# writes into the per-turn CODEX_HOME and the bridge's own state directory, both of which sit
# outside that root by construction. Network egress is off.
#
# IT DOES NOT NARROW READS, and reading this entry as if it did would be a mistake. Codex's
# sandbox scopes WRITES only — there is no `readable_roots` — so the child can read anything
# the bridge's unix user can read, at every level. That is a RECORDED, ACCEPTED property of
# this harness (see the `[[accepted]]` block in bridge/containment-codex.toml), not an
# oversight, and the remedy if it ever stops being acceptable is unix-user isolation, not a
# config key.
#
# `level = "basic"` is refused at startup on this harness — see the `harness` field above.
#
# Arm it with: JESSE_CODEX_TOKEN=...
# [[models]]
# id = "codex-native"
# label = "Codex (native)"
# kind = "hosted"
# harness = "codex"                        # a real `codex exec` child
# base_url = "http://127.0.0.1:8900"       # health probe only on this path; the turn does
#                                          # not use it — auth and endpoint come from the
#                                          # subscription login in ~/.codex
# model = "gpt-5-codex"
# auth_token_env = "JESSE_CODEX_TOKEN"     # the NAME of the env var, never the token
# level = "write"                          # OS-sandboxed writes, scoped to the vault
# price = { in_per_m = 1.25, cached_per_m = 0.13, out_per_m = 10.00 }
# health = { interval_secs = 30, timeout_secs = 3 }

# ---------------------------------------------------------------------------
# Vision helpers — let a hosted TEXT model "see" image/PDF attachments
# ---------------------------------------------------------------------------
#
# A text model (GLM, Codex, …) can't read images. It gains vision ONLY by being
# PAIRED with one or more registered VISION HELPERS. A helper is just another
# registered model (a [[models]] entry / JESSE_MODEL_* triple) whose base_url points
# at the provider or the local Anthropic-surface gateway; the bridge calls it directly
# on /v1/messages with the image as a base64 block and splices the transcription into
# the prompt. The raw image never reaches the text model. Pairing is per-model, not a
# global switch: an UNPAIRED model handles attachments exactly as before (the CLI Read
# tool), and GET /jesse/models reports it as vision.enabled=false.
#
# PRIVACY: pairing a hosted helper sends the uploaded image/PDF bytes to that helper's
# backend. That is a real egress of user uploads (consistent with running a hosted text
# model there). Keep uploads local by pairing a local-only helper alias instead.
#
# DO NOT PAIR A NATIVELY-MULTIMODAL MODEL. `kimi-k3` reads images itself, so leaving it
# UNPAIRED is what gives it vision: attachments take the CLI Read-tool path and the child
# hands the model the actual image. Pairing it would transcribe the image to text first
# and hide the pixels from a model that can see them — worse answers AND a second billed
# call. GET /jesse/models will show vision.enabled=false for such a model; that flag means
# "no HELPER is attached", not "cannot see".
#
# 1) Register the helpers as ordinary models (armed by their token env var):
#
# [[models]]
# id = "paddleocr-vl"
# label = "PaddleOCR VL (doc)"
# kind = "hosted"
# base_url = "https://api.fireworks.ai/inference"   # or the local gateway
# model = "accounts/fireworks/models/<resolved-slug>"  # resolve from GET /v1/models
# auth_token_env = "FIREWORKS_API_KEY"
# price = { in_per_m = 0.10, cached_per_m = 0.01, out_per_m = 0.30 }
#
# [[models]]
# id = "qwen3-vl"
# label = "Qwen3-VL (general)"
# kind = "hosted"
# base_url = "https://api.fireworks.ai/inference"
# model = "accounts/fireworks/models/<resolved-slug>"
# auth_token_env = "FIREWORKS_API_KEY"
# price = { in_per_m = 0.20, cached_per_m = 0.02, out_per_m = 0.60 }
#
# 2) Pair a text model with them (role: "doc" | "general" | "any"). Declarative:
#
# [[models]]
# id = "glm-5.2"
# label = "GLM 5.2"
# kind = "hosted"
# base_url = "https://api.fireworks.ai/inference"
# model = "accounts/fireworks/models/glm-5p2"
# auth_token_env = "FIREWORKS_API_KEY"
# vision = [ { id = "paddleocr-vl", role = "doc" }, { id = "qwen3-vl", role = "general" } ]
# vision_complementary = false   # true = run BOTH helpers on one attachment, concatenate
#
#   Or pair the env-triple models without a [[models]] block:
#     JESSE_MODEL_GLM_VISION="paddleocr-vl:doc,qwen3-vl:general"
#     JESSE_MODEL_GLM_VISION_COMPLEMENTARY=off      # (glm-5.2 / kimi-k3 / local supported)
#   A single "any" helper handles every attachment type:  JESSE_MODEL_GLM_VISION="qwen3-vl:any"
#
# 3) Global vision knobs (env, no rebuild):
#     JESSE_VISION_PDF_PAGE_CAP=10     # pages rasterized+sent per PDF (truncation is noted)
#     JESSE_VISION_PDF_DPI=200         # rasterization DPI
#     JESSE_VISION_MAX_TOKENS=4096     # helper output-token cap
#     JESSE_VISION_TIMEOUT_SECS=60     # per-helper-call budget
#   The PDF path needs nothing installed: pages are rendered with macOS's own Core Graphics,
#   and a HEIC photo is transcoded to PNG with `sips`. Both are macOS-only, by design.
#
# Vet a candidate helper before pairing it (no chat turn needed):
#     vision-compare ./eval/vision/fixtures/statement.pdf paddleocr-vl,qwen3-vl
#     vision-eval    ./eval/vision/manifest.json paddleocr-vl

# =============================================================================
# [[schedule]] — recurring turns, fired by the bridge itself
# =============================================================================
#
# The bridge runs these on its own. No desktop app has to be open, no GUI account
# has to be signed in, and no cron or launchd job is involved: the always-on
# service that answers your phone is the thing that fires them.
#
# WHY IT IS BUILT LIKE THIS. The jobs this replaced lived in a desktop scheduler
# that silently stopped firing, and nobody noticed for a month. So:
#
#   * every due job ends with an outcome — ran, failed or skipped — and a skip
#     ALWAYS says why;
#   * each of those is logged, recorded in <state-dir>/schedule.json, and pushed
#     to the phone (see `notify`);
#   * GET /jesse/schedule answers "did the morning routine run today, and how
#     long did it take" in ONE authenticated request. Use it. That is the whole
#     point of the endpoint:
#         curl -sH "authorization: Bearer $JESSE_TOKEN" \
#              http://127.0.0.1:8765/jesse/schedule | jq
#
# CHAINS, NOT A LIST OF CLOCK TIMES. These jobs all write the same working tree,
# so two of them overlapping produces real conflicts. Rather than spacing them at
# wall-clock times and hoping the estimates hold — estimates rot, and the day a
# job runs long is the day you get a conflict — a job hangs off another with
# `after` and starts only once that job's turn has FULLY completed.
#
# At most ONE scheduled turn runs at any moment, across every chain. If a second
# chain's head comes due while another chain is running, it waits; if it is still
# waiting when its `catch_up_secs` expires it is skipped and recorded. A scheduled
# turn also yields to YOU: if the request concurrency limit is saturated by turns
# from the app, it waits briefly and then skips rather than queueing behind you.
#
# Each fire is a fresh conversation and a normal turn — it lands in the job store
# with a job id, retries and fails exactly like a phone turn, and is retrievable
# at GET /jesse/result/{id} (the schedule endpoint reports that id as
# `last_job_id`, and the push carries it so the tap opens the finished turn).
#
# ---------------------------------------------------------------------------
# The keys
# ---------------------------------------------------------------------------
#
#   id             REQUIRED, unique, stable. It is the state key and the handle
#                  `after` refers to, so renaming one forgets its history. Two
#                  entries sharing an id is a STARTUP ERROR (which one is
#                  "nightly"? — the intent is unknowable).
#   enabled        default true. `false` keeps the entry and stops it firing. A
#                  disabled job breaks an `after_on = "success"` chain behind it,
#                  which is the documented meaning of switching one off.
#   at             LOCAL wall-clock "HH:MM". A job with `at` is a chain HEAD.
#                  DST is handled properly: on the spring-forward day a time that
#                  does not exist fires when the clock jumps past it (02:30 runs
#                  at 03:00) rather than being silently skipped, and on the
#                  fall-back day a time that happens twice fires exactly once.
#   after          the `id` of another job. A job with `after` is a chain LINK: it
#                  fires when that job finishes, never at a clock time.
#                  EXACTLY ONE of `at` / `after` is required. Both, or neither,
#                  disables that entry (and only that entry). A cycle in the
#                  `after` graph is a STARTUP ERROR that prints the cycle.
#   after_on       "success" (default) | "any". With "success" the link does not
#                  run if its predecessor failed, was skipped, or was disabled,
#                  and the whole rest of that chain is recorded as skipped naming
#                  the job that broke it. With "any" it runs regardless — for the
#                  report or cleanup step you most want when the step before it
#                  went wrong. Only valid on a link.
#   days           weekday names, default all seven ("mon".."sun", or full names).
#                  Applies to HEADS AND LINKS alike, so a link can be narrower
#                  than its head — a Monday-only job hanging off a daily chain.
#   prompt         inline text for the turn, OR
#   prompt_file    a path to a file holding it. Exactly one is required.
#                  A RELATIVE path resolves against the vault root; an absolute
#                  path is used as given. It is READ AT FIRE TIME and never
#                  cached, so editing a prompt needs no restart. A missing or
#                  unreadable file at fire time is a FAILED run carrying that
#                  reason — never a crash, never a silently empty turn.
#   mode           "tell" (default) | "ask" — the same modes a normal turn takes.
#                  Scheduled work usually acts, hence the default.
#   timeout_secs   per-job override of the global per-turn run limit
#                  (JESSE_TIMEOUT), still clamped to the same hard ceiling. For
#                  the one long job in a chain of short ones.
#   notify         default true — push the outcome to the phone. A failure or an
#                  unexpected skip pushes with its reason named; a chain that
#                  breaks pushes ONCE for the break, not once per skipped link.
#                  Two things deliberately do not push (they are what you asked
#                  for, not news): a link skipped by its own `days` filter, and a
#                  disabled entry. Set false to silence a job entirely — but note
#                  that silence is exactly the failure this feature exists to fix.
#   catch_up_secs  default 3600. HEADS ONLY (a link has no clock to be late
#                  against; setting it on one disables that entry). If the host
#                  was asleep or the service was down when the job was due, it
#                  still runs when the service comes back — provided the delay is
#                  within this window. Past it, the run is SKIPPED and the skip
#                  records how late it was. Raise it for a job worth running
#                  late; lower it for one that is worthless off its hour.
#
# A misconfiguration never takes the bridge down. An entry that fails validation
# (both or neither of `at`/`after`, an unknown `after` target, `catch_up_secs` on
# a link, an unparseable time or weekday, an unrecognized key) is logged with its
# id, disabled ON ITS OWN, and listed under `invalid` on GET /jesse/schedule —
# while every other job still runs. Only a duplicate id and an `after` cycle
# refuse to start, because both make your intent unknowable.
#
# ---------------------------------------------------------------------------
# Worked example 1 — an overnight chain: one head, three links
# ---------------------------------------------------------------------------
#
# Head at 02:30 local, then three jobs each waiting for the one before it. The
# third is Fridays only, so on any other day it is skipped (and its own tail with
# it) while the rest of the chain runs normally.

# [[schedule]]
# id = "overnight-tidy"                  # the chain HEAD
# at = "02:30"                           # local wall clock
# prompt_file = "prompts/overnight-tidy.md"
# catch_up_secs = 7200                   # still worth running up to 2h late
#
# [[schedule]]
# id = "overnight-index"                 # runs when overnight-tidy has FINISHED
# after = "overnight-tidy"
# prompt_file = "prompts/overnight-index.md"
#
# [[schedule]]
# id = "overnight-digest"
# after = "overnight-index"
# prompt_file = "prompts/overnight-digest.md"
#
# [[schedule]]
# id = "overnight-archive"               # the weekly one, on a daily chain
# after = "overnight-digest"
# days = ["fri"]
# prompt_file = "prompts/overnight-archive.md"

# ---------------------------------------------------------------------------
# Worked example 2 — a morning chain anchored to a real-world event
# ---------------------------------------------------------------------------
#
# The head's `at` is chosen to line up with something in the world (here: the
# household's alarm, so the briefing is ready when the phone is picked up). Its
# catch-up window is short on purpose — a "good morning" briefing delivered at
# lunchtime is worse than one that visibly did not run, and the skip says so.
#
# The last link is the long one: a weekly deep pass that needs far more than the
# global per-turn limit, so it names its own. It runs on `after_on = "any"` so a
# failure earlier in the chain does not cost you the weekly pass as well.

# [[schedule]]
# id = "morning-brief"                   # anchored to the 06:45 alarm
# at = "06:45"
# days = ["mon", "tue", "wed", "thu", "fri"]
# prompt_file = "prompts/morning-brief.md"
# catch_up_secs = 900                    # 15 min: after that it is not "morning"
#
# [[schedule]]
# id = "morning-inbox"
# after = "morning-brief"
# prompt_file = "prompts/morning-inbox.md"
# mode = "tell"                          # the default; shown for completeness
#
# [[schedule]]
# id = "weekly-deep-pass"                # the long one
# after = "morning-inbox"
# after_on = "any"                       # run it even if the inbox pass failed
# days = ["mon"]
# prompt_file = "prompts/weekly-deep-pass.md"
# timeout_secs = 5400                    # 90 min, well past the usual turn limit
# notify = true                          # the default; this one you want to hear
