  "  isolation is still not in place, and this grant does not claim it is. Binary: this",
  "  acceptance is cut against the codex-cli version the record was regenerated on, which",
  "  is the version production runs.",
  "",
  "WHAT THIS BLOCK ACTUALLY COVERS, AND WHERE THE WORDS ABOVE DO NOT MATCH THE RECORD.",
  "The authorization says \"the twelve write-row opens\". THERE ARE SIX. `SHIPPED_ROWS`",
  "holds four pairs and only ONE of them is a write pair — `write/qmd` — because a Write",
  "turn is always a main turn and a main turn always loads qmd. There is no `write/none`",
  "row to sign, so this block covers `write/qmd` and its six open baselines, which is",
  "every write-row open there is. The count was wrong; the scope was not.",
  "",
  "The other six unsigned opens sit at `basic/none`, which is NOT a write row and is NOT",
  "signed here. `Codex::expresses` is `capability > Basic`, so that row can never be",
  "spawned by this harness and the level walk skips it; it is probed only because the",
  "battery runs every pair in `SHIPPED_ROWS`. The read acceptance above declined it on",
