[package]
name = "jesse-bridge"
version = "0.62.0"
edition = "2021"
license = "Apache-2.0"

# The live containment battery — the probe prompts, the runner, its loopback listener
# and the scratch worlds (`src/probe.rs`). OFF by default, so the serving binary is
# built without a line of it: none of it answers a turn, and it would otherwise put the
# probe machinery (and ~40 more names) inside the bridge that talks to the phone.
#
# The record itself (`bridge/containment.toml`), its parser and the scoring rules stay
# on the always-compiled path in `src/containment.rs`, because the startup gate reads
# all three on every boot.
#
#   cargo test    --features containment-probe          # incl. tests/containment.rs
#   cargo run     --features containment-probe --bin containment-probe -- --write
#   cargo build   --release                             # the serving binary, without it
[features]
containment-probe = []

# Declared (rather than auto-discovered) so `required-features` can keep them out of a
# default build; every other bin under src/bin stays auto-discovered.
[[bin]]
name = "containment-probe"
required-features = ["containment-probe"]

[[test]]
name = "containment"
required-features = ["containment-probe"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON5 parser for the vault's `window.X = <literal>;` diet data files (GET
# /jesse/diet). They are data-only JS literals — unquoted keys, single quotes,
# trailing commas, // comments — not strict JSON, so `serde_json` can't read them.
# json5 handles exactly that superset; we strip the assignment wrapper and parse
# the literal. No hand-rolled JS parsing, no regex quote-rewriting.
json5 = "0.4"
# TOML parser for the optional gitignored `jesse.local.toml` persona overlay
# (owner name/pronoun/languages + extra diet vocabulary). Read once at startup,
# layered under the environment; a missing/malformed file soft-fails to the
# generic built-in defaults so a fresh clone needs no config at all.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# RFC 4180 CSV reader for the vault's `weight-log.csv` (GET /jesse/diet). Its Notes
# column contains quoted commas, so a naive split(',') corrupts rows — the csv
# crate handles quoting/escaping correctly.
csv = "1"
qrcode = "0.14"
# uuid: conversation identity. A conversation is the bridge's first-class thread
# record and its id must be a UUID for two distinct reasons, both of which need a
# real implementation rather than a hand-rolled hex formatter:
#   * v4 for a freshly minted conversation, so the bridge can hand an id back to a
#     client that did not send one without any coordination or collision risk;
#   * v5 for adopting a legacy transcript that has no record, so the id derived from
#     a Claude session id is DETERMINISTIC: adoption is idempotent, and a lost state
#     dir rebuilt from the transcripts alone reproduces exactly the same ids, which is
#     what keeps a client's stored conversation ids valid across that recovery.
# Only the two generators and the canonical lowercase-hyphenated formatting are used;
# `v5` also pulls the sha1 hasher it is defined in terms of. No serde feature (the
# record stores the id as a String, so the wire and disk shapes stay plain JSON).
uuid = { version = "1", features = ["v4", "v5"] }
subtle = "2"
# Only the `Stream` trait, to feed axum's SSE response. Already in the lock
# (a transitive dep of axum), so naming it directly pulls no new compiled code.
# The live-stream plumbing itself is tokio::sync::broadcast/mpsc + std.
futures-core = "0.3"
# APNs (optional push, disabled unless JESSE_APNS_* is set) needs an HTTP/2 client
# and ES256 JWT signing — the only justification for these two deps.
#
# reqwest: APNs requires HTTP/2 to api.push.apple.com. rustls-only (no OpenSSL /
# native-tls) keeps the single-static-binary property; webpki-roots bundles the
# Mozilla trust store so there's no OS cert-store dependency. default-features off
# so no native-tls is pulled. Only used by the push path; never on a normal turn.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
# ring: ES256 (ECDSA P-256) signing of the APNs auth JWT. ECDSA_P256_SHA256_FIXED
# emits the raw R||S signature JWS requires. ring is already in the graph (rustls'
# crypto backend), so this adds no new TLS/crypto stack. Used only to sign the JWT.
ring = "0.17"
# libc: ONE syscall — setpriority(2) — to drop the opt-in shadow-comparison child
# to a background nice value so a mirrored ask never contends for CPU with a live
# phone turn (JESSE_SHADOW_*). Unix-only, best-effort (errors ignored). libc is
# already deep in the graph (tokio/reqwest/ring), so naming it adds no new build.
libc = "0.2"
# --- Vision helper layer (JESSE_MODEL_*_VISION) --------------------------------
# Only reached when a text model is paired with a vision helper AND a turn carries
# a PDF/image attachment; every non-vision path compiles and runs identically.
#
# pdfium-render: rasterize each PDF page to a bitmap before sending it to a VL
# helper (a text model cannot read a PDF; the helper reads page images). Chosen over
# mupdf because it binds to pdfium at RUNTIME (dlopen) rather than linking a C
# library at build time — so `cargo build` and CI compile with NO native lib present
# (the single-static-binary property is preserved for every deploy that never turns
# vision on), and only a deploy that actually rasterizes needs libpdfium installed.
# Rasterization tests are therefore gated behind JESSE_PDFIUM_LIB so CI stays green.
# Default features only (no `bindgen`, no `static`): ships pre-generated bindings and
# loads the lib dynamically. This is the "real library, not a fragile shell-out" the
# design calls for.
pdfium-render = "0.8"
# image: encode the rasterized PDF pages to PNG for the helper request, and decode /
# downscale oversized raster inputs. Pure Rust (no C deps → static binary intact);
# only the codecs the whitelist admits are enabled. PNG is the wire format sent to
# the Anthropic image-block surface; the sniffed input types map onto these decoders.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }   # ServiceExt::oneshot
