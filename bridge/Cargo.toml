[package]
name = "jesse-bridge"
version = "0.100.0"
edition = "2021"
license = "Apache-2.0"

# The live containment battery — the probe prompts, the runner, its loopback listener
# and the scratch worlds (`src/probe.rs`). OFF by default, so the serving binary is
# built without a line of it: none of it answers a turn, and it would otherwise put the
# probe machinery (and ~40 more names) inside the bridge that talks to the phone.
#
# The record itself (`bridge/containment.toml`), its parser and the scoring rules stay
# on the always-compiled path in `src/containment.rs`, because the startup gate reads
# all three on every boot.
#
#   cargo test    --features containment-probe          # incl. tests/containment.rs
#   cargo run     --features containment-probe --bin containment-probe -- --write
#   cargo build   --release                             # the serving binary, without it
[features]
containment-probe = []

# Declared (rather than auto-discovered) so `required-features` can keep them out of a
# default build; every other bin under src/bin stays auto-discovered.
[[bin]]
name = "containment-probe"
required-features = ["containment-probe"]

[[test]]
name = "containment"
required-features = ["containment-probe"]

# THE SENTINEL. Declared so the artifact is `jesse-sentinel` — the name the launchd plist,
# the installer and `~/.local/bin` all use — rather than `sentinel`, which is what
# auto-discovery would derive from the file name. The file stays at `src/bin/sentinel.rs`
# beside its `src/sentinel/` module tree; naming a target's path here simply takes it out of
# auto-discovery, so there is no duplicate.
#
# It is NOT behind a feature. Unlike `containment-probe`, this binary is part of a deploy:
# `cargo build --release` is what the install script builds with, and a sentinel that only
# existed under a non-default feature would be a sentinel nobody has when they need it.
[[bin]]
name = "jesse-sentinel"
path = "src/bin/sentinel.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON5 parser for the vault's `window.X = <literal>;` diet data files (GET
# /jesse/diet). They are data-only JS literals — unquoted keys, single quotes,
# trailing commas, // comments — not strict JSON, so `serde_json` can't read them.
# json5 handles exactly that superset; we strip the assignment wrapper and parse
# the literal. No hand-rolled JS parsing, no regex quote-rewriting.
json5 = "0.4"
# TOML parser for the optional gitignored `jesse.local.toml` persona overlay
# (owner name/pronoun/languages + extra diet vocabulary). Read once at startup,
# layered under the environment; a missing/malformed file soft-fails to the
# generic built-in defaults so a fresh clone needs no config at all.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# RFC 4180 CSV reader for the vault's `weight-log.csv` (GET /jesse/diet). Its Notes
# column contains quoted commas, so a naive split(',') corrupts rows — the csv
# crate handles quoting/escaping correctly.
csv = "1"
qrcode = "0.14"
# uuid: conversation identity. A conversation is the bridge's first-class thread
# record and its id must be a UUID for two distinct reasons, both of which need a
# real implementation rather than a hand-rolled hex formatter:
#   * v4 for a freshly minted conversation, so the bridge can hand an id back to a
#     client that did not send one without any coordination or collision risk;
#   * v5 for adopting a legacy transcript that has no record, so the id derived from
#     a Claude session id is DETERMINISTIC: adoption is idempotent, and a lost state
#     dir rebuilt from the transcripts alone reproduces exactly the same ids, which is
#     what keeps a client's stored conversation ids valid across that recovery.
# Only the two generators and the canonical lowercase-hyphenated formatting are used;
# `v5` also pulls the sha1 hasher it is defined in terms of. No serde feature (the
# record stores the id as a String, so the wire and disk shapes stay plain JSON).
uuid = { version = "1", features = ["v4", "v5"] }
subtle = "2"
# Only the `Stream` trait, to feed axum's SSE response. Already in the lock
# (a transitive dep of axum), so naming it directly pulls no new compiled code.
# The live-stream plumbing itself is tokio::sync::broadcast/mpsc + std.
futures-core = "0.3"
# APNs (optional push, disabled unless JESSE_APNS_* is set) needs an HTTP/2 client
# and ES256 JWT signing — the only justification for these two deps.
#
# reqwest: APNs requires HTTP/2 to api.push.apple.com. rustls-only (no OpenSSL /
# native-tls) keeps the single-static-binary property; webpki-roots bundles the
# Mozilla trust store so there's no OS cert-store dependency. default-features off
# so no native-tls is pulled. Only used by the push path; never on a normal turn.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
# ring: ES256 (ECDSA P-256) signing of the APNs auth JWT. ECDSA_P256_SHA256_FIXED
# emits the raw R||S signature JWS requires. ring is already in the graph (rustls'
# crypto backend), so this adds no new TLS/crypto stack. Used only to sign the JWT.
ring = "0.17"
# libc: ONE syscall — setpriority(2) — to drop the opt-in shadow-comparison child
# to a background nice value so a mirrored ask never contends for CPU with a live
# phone turn (JESSE_SHADOW_*). Unix-only, best-effort (errors ignored). libc is
# already deep in the graph (tokio/reqwest/ring), so naming it adds no new build.
libc = "0.2"
# --- Vision helper layer (JESSE_MODEL_*_VISION) --------------------------------
# Only reached when a text model is paired with a vision helper AND a turn carries
# a PDF/image attachment; every non-vision path compiles and runs identically.
#
# There is NO PDF crate here, and that is the point. Rasterizing a PDF page used to mean
# `pdfium-render`, picked because it binds libpdfium at RUNTIME (dlopen) so the build
# needed no native library. True about the build, wrong about the deploy: libpdfium is not
# on a stock Mac, so every PDF attachment failed with "pdfium library unavailable" unless
# someone installed a native lib by hand and set JESSE_PDFIUM_LIB. The renderer that IS on
# every Mac is Core Graphics' own, reached by direct FFI in `src/cgpdf.rs` — no crate, no
# native install, no supply chain, and it addresses pages individually (which `sips`, the
# other shell-out on the box, cannot: it converts only page 1).
#
# image: encode the rasterized PDF pages to PNG for the helper request, and decode /
# downscale oversized raster inputs. Pure Rust (no C deps → static binary intact);
# only the codecs the whitelist admits are enabled. PNG is the wire format sent to
# the Anthropic image-block surface; the sniffed input types map onto these decoders.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# --- The built-in scheduler (`[[schedule]]`) -----------------------------------
#
# chrono: LOCAL WALL-CLOCK date math with a real DST implementation. A scheduled job is
# declared as "02:30 local", and the two days a year that phrase is not a single instant
# are exactly the days a hand-rolled `next_fire` gets wrong: on the spring-forward day
# 02:30 does not exist (naive arithmetic silently skips the job for that day), and on the
# fall-back day it happens twice (naive arithmetic runs it twice). Nothing else in this
# graph knows what a time zone is — `toml_datetime` only parses, and the rest of the bridge
# works in unix millis — so this is the one place a date crate earns its place.
#
# `clock` is what supplies `Local` (the host's zone, read from the OS); `std` keeps it off
# `alloc`-only. NO `serde` feature: the schedule's times are parsed from `"HH:MM"` strings
# by hand and the persisted state file stores unix millis, so no chrono type is ever
# serialized. `default-features = false` drops `oldtime`/`wasmbind` and their baggage.
#
# What is used: `NaiveTime`/`NaiveDate`, `TimeZone::from_local_datetime` (whose
# `LocalResult::{None,Ambiguous}` arms ARE the two DST cases above), and `Weekday`.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# iana-time-zone: ONE call — the host zone's IANA NAME, for `GET /jesse/schedule`'s `tz`
# field. A bare UTC offset cannot answer the question that field exists for ("does 03:30
# mean what I think it does"): `+02:00` is Rome in August and something else in January,
# and the app, the away profile and the sentinel all need to name the zone rather than
# describe today's offset. Already in the lock — `chrono`'s `clock` feature reaches the OS
# zone through exactly this crate — so naming it directly pulls no new compiled code.
iana-time-zone = "0.1"
# chrono-tz: a BUNDLED tz database. A DEV-dependency until 0.91.0, on the reasoning that
# the serving binary has no business carrying a tz table when the host's zone is what
# production wants — which stopped being true the moment the bridge had to answer dates for
# an owner standing in a DIFFERENT zone from the host. The away profile names its zone as
# an IANA string (`Europe/London`) and the phone may name one per request (`client_tz`);
# resolving either needs the table, and a bare UTC offset cannot substitute for it because
# a fortnight-long trip crosses a DST transition in one zone and not the other.
#
# `default-features = false` drops the `filter-by-regex`/serde extras; what is used is
# `str::parse::<Tz>()`, `Tz::name()`, and the `TimeZone` impl the DST-correct resolver in
# `schedule::resolve_local` already drives generically. It is also still what the tests
# pin zones with — `next_fire` stays generic over `chrono::TimeZone` so the spring-forward
# and fall-back cases are asserted against `America/New_York` rather than against whatever
# zone the machine running `cargo test` happens to be in.
chrono-tz = { version = "0.10.4", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }   # ServiceExt::oneshot
