[package]
name = "jesse-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Provider-neutral agent layer for Jesse: one request/response model, one streaming event vocabulary, and per-wire adapters (Anthropic Messages, OpenAI Chat Completions)."

# NO DEPENDENCY ON `bridge/` IN EITHER DIRECTION. The bridge is excluded from the root
# workspace (see the root Cargo.toml) and builds standalone from its own Cargo.lock; a
# path dependency either way would drag one build into the other's lockfile and undo
# that. D4 is where the bridge adopts `TokenUsage`; until then the two are strangers.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The HTTP client. Same feature set and the same reasoning as the bridge's: rustls-only
# (no OpenSSL / native-tls) keeps the single-static-binary property, `webpki-roots`
# bundles the Mozilla trust store so there is no OS cert-store dependency, and
# `default-features = false` keeps native-tls out. `http2` because both wires serve it.
#
# NOT the `stream` feature: the SSE reader pulls the body with `Response::chunk()`,
# which is inherent on `Response` and needs no feature. `stream` would only add a
# `futures`-flavoured wrapper over the same bytes.
# NOT the `json` feature: bodies are built as strings with `serde_json`, exactly as
# `bridge/src/vision.rs` and `bridge/src/health.rs` build theirs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
# The async runtime pieces the provider layer itself uses: `rt` to spawn the one reader
# task per call, `sync` for the event channel and the audit slot, `time` for the retry
# backoff and the header-phase timeout. `macros` for `select!` in the reader loop.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# `CancellationToken` — the cancellation primitive `Provider::stream` takes. Hand-rolling
# one over `AtomicBool` + `Notify` was rejected: cancellation has to compose (D2's loop
# will hold a turn-scoped parent and hand child tokens to each provider call), and
# `CancellationToken` is the type that already composes that way.
tokio-util = "0.7"
# Only the `Stream` trait, so `EventStream` is a real stream D2 can compose with rather
# than a bespoke `recv()` loop. Same justification as the bridge's use of it for axum's
# SSE response: the trait only, no combinators, no `futures-util`.
futures-core = "0.3"
# Redaction (`provider::http::redact`). The patterns it strips — `Bearer <token>`,
# `x-api-key: <token>`, `"api_key": "<token>"`, and bare high-entropy runs — are
# alternations with captures, which is what a regex is for; the hand-rolled byte
# scanner it replaced was longer and got the boundary cases wrong. `regex` is already
# in this workspace's lockfile (`eval/` uses it), so this pulls no new compiled code.
regex = "1"

[dev-dependencies]
# The conformance suite binds real loopback sockets and speaks HTTP/1.1 by hand, the
# same way `bridge/tests/integration.rs` stands up its mock `/v1/messages` helper. That
# needs the full runtime (`net`, `io-util`, `rt-multi-thread`).
tokio = { version = "1", features = ["full"] }
serde_json = "1"
