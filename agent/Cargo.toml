[package]
name = "jesse-agent"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Provider-neutral agent layer for Jesse: one request/response model, one streaming event vocabulary, per-wire adapters (Anthropic Messages, OpenAI Chat Completions, OpenAI Responses), and the tool-calling turn loop that runs on top of them."

# NO DEPENDENCY ON `bridge/` IN EITHER DIRECTION. The bridge is excluded from the root
# workspace (see the root Cargo.toml) and builds standalone from its own Cargo.lock; a
# path dependency either way would drag one build into the other's lockfile and undo
# that. D4 is where the bridge adopts `TokenUsage`; until then the two are strangers.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The HTTP client. Same feature set and the same reasoning as the bridge's: rustls-only
# (no OpenSSL / native-tls) keeps the single-static-binary property, `webpki-roots`
# bundles the Mozilla trust store so there is no OS cert-store dependency, and
# `default-features = false` keeps native-tls out. `http2` because both wires serve it.
#
# NOT the `stream` feature: the SSE reader pulls the body with `Response::chunk()`,
# which is inherent on `Response` and needs no feature. `stream` would only add a
# `futures`-flavoured wrapper over the same bytes.
# NOT the `json` feature: bodies are built as strings with `serde_json`, exactly as
# `bridge/src/vision.rs` and `bridge/src/health.rs` build theirs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
# The async runtime pieces the provider layer itself uses: `rt` to spawn the one reader
# task per call, `sync` for the event channel and the audit slot, `time` for the retry
# backoff and the header-phase timeout. `macros` for `select!` in the reader loop.
# `signal` is for the CLI's Ctrl-C handler (`src/bin/jesse-agent.rs`), which CANCELS the
# turn rather than killing the process — so the partial answer, the thread append and the
# usage records all still happen. `rt-multi-thread` is deliberately NOT added: the binary
# runs on a current-thread runtime, because the loop needs concurrency (a batch of reads
# awaiting together) and never parallelism, and a library dependency added for one
# binary's convenience is paid for by every consumer of the library.
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "signal"] }
# `CancellationToken` — the cancellation primitive `Provider::stream` takes. Hand-rolling
# one over `AtomicBool` + `Notify` was rejected: cancellation has to compose (D2's loop
# will hold a turn-scoped parent and hand child tokens to each provider call), and
# `CancellationToken` is the type that already composes that way.
tokio-util = "0.7"
# Only the `Stream` trait, so `EventStream` is a real stream D2 can compose with rather
# than a bespoke `recv()` loop. Same justification as the bridge's use of it for axum's
# SSE response: the trait only, no combinators, no `futures-util`.
futures-core = "0.3"
# Redaction (`provider::http::redact`). The patterns it strips — `Bearer <token>`,
# `x-api-key: <token>`, `"api_key": "<token>"`, and bare high-entropy runs — are
# alternations with captures, which is what a regex is for; the hand-rolled byte
# scanner it replaced was longer and got the boundary cases wrong. `regex` is already
# in this workspace's lockfile (`eval/` uses it), so this pulls no new compiled code.
regex = "1"
# Sixteen random bytes per thread id, and nothing else. `rand` was rejected as a large
# dependency for one call, and the crate's own `provider::http::jitter` was rejected
# because it says in its own doc comment that it is not cryptographic — a thread id is a
# handle a stored conversation is fetched by, so it needs the property jitter disclaims.
# Already in this workspace's lockfile, so it adds no new compiled code to the workspace.
getrandom = "0.4"
# SHA-256 for the document content hash, and it must be THE SAME sha256 the bridge's
# `writelock.rs::hash_file` computes: D4 feeds this store's hashes to the bridge's
# per-conversation compare-and-swap baseline, and two hashes that disagreed would make every
# baseline comparison fail. `ring` is what the bridge uses (it is already in its graph for
# APNs JWT signing) and it is already in this workspace's lockfile via rustls, so this adds
# no new compiled code. A pure-Rust `sha2` would be a second implementation of one constant.
ring = "0.17"

[features]
# The scripted `Provider` (`provider::scripted`) and the `EventStream::scripted`
# constructor it needs. OFF by default so a release build of this library contains no
# `Provider` that fabricates answers; the crate's own tests get it through `cfg(test)`,
# and the eval driver turns it on explicitly.
scripted = []

[dev-dependencies]
# THE CRATE, AS A DEV-DEPENDENCY ON ITSELF, to turn the `scripted` feature on for test
# targets only. Cargo permits this cycle for dev-dependencies specifically, and it is the
# only way an INTEGRATION test (which links the library as an external crate, without
# `cfg(test)`) can see a feature-gated module. Without it the loop's scripted-provider
# cases and its loopback-adapter cases would have to live in different files, and the claim
# that a turn produces IDENTICAL thread contents on all four providers could not be
# asserted in one function. `cargo build` is unaffected: dev-dependencies are not built.
jesse-agent = { path = ".", features = ["scripted"] }
# TOML round trip for the persona pack, TESTS ONLY. The pack is serialised with `serde` and
# the library itself needs no TOML: the bridge already carries a TOML parser for the config
# file it loads the pack from, and adding a second one to this crate would put a parser in
# every consumer's binary to satisfy one assertion. `default-features = false` plus the two
# halves of the round trip keeps even the test build narrow. Same 0.8 the bridge pins.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# The conformance suite binds real loopback sockets and speaks HTTP/1.1 by hand, the
# same way `bridge/tests/integration.rs` stands up its mock `/v1/messages` helper. That
# needs the full runtime (`net`, `io-util`, `rt-multi-thread`).
tokio = { version = "1", features = ["full"] }
serde_json = "1"
