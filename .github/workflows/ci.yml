name: CI

# THIS WORKFLOW IS LINUX-ONLY, AND IT IS THE GATE ON EVERY PR.
#
# The Swift/macOS half of CI is NOT here — it lives in ios-ci.yml, which runs
# nightly against main plus manual dispatch, and skips itself when no
# iOS-relevant path changed. It was moved out because GitHub's hosted macOS
# runners bill at 10x the Linux rate and that one job was essentially all of
# this repo's Actions spend: it booted three simulators and ran four
# uncached builds on every PR and every push to main.
#
# The pre-merge check for the app is therefore LOCAL, not hosted:
# `scripts/local-ci-macos.sh` runs the same checks on your own Mac, and the
# pre-push hook (`scripts/install-hooks.sh`) runs it for you and blocks the
# push if it fails. The nightly is the backstop that catches what a bypassed
# hook let through — it is not the gate. See README → Development.
#
# One CI run per ref. On PR branches a new push cancels the superseded run;
# runs on main are never cancelled, so every merge commit keeps a complete CI
# record. Restricting `push` to main stops the duplicate push+pull_request
# runs PR branches used to get.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # THE ROOT WORKSPACE'S `agent/` CRATE. A separate job from `bridge` on purpose: the
  # bridge is EXCLUDED from the root workspace (see the root Cargo.toml) and builds from
  # `working-directory: bridge` with its own Cargo.lock, so one `cargo` invocation cannot
  # cover both and nothing here changes how the bridge is built.
  #
  # SCOPED TO `-p jesse-agent`, NOT THE WHOLE WORKSPACE. The other member, `eval/`, has its
  # own job below: the two crates fail for different reasons and a combined job would make
  # "CI is red" stop telling you which one. Nothing about the bridge changes either way.
  agent:
    name: agent (build, test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-agent-${{ hashFiles('Cargo.lock') }}

      # `--locked` for the same reason it is on the bridge's release build: the lock must be
      # the one that ships, not one CI quietly regenerated. See that step's comment.
      - name: Build
        run: cargo build -p jesse-agent --locked

      # `--all-targets` so the conformance suite AND `examples/smoke.rs` are compiled. The
      # smoke is an example rather than a test precisely so this compiles it and never
      # RUNS it: it needs a live endpoint and a credential, neither of which belongs in CI.
      - name: Test
        run: cargo test -p jesse-agent --all-targets

      - name: Clippy
        run: cargo clippy -p jesse-agent --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -p jesse-agent --check

  # THE EVAL HARNESS. New in D7, and it joins CI at the same time as the `product-v1`
  # suite it validates: the teeth check (good mock scores every task, known-bad mock scores
  # none, on BOTH drivers) lives in `eval/tests/integration.rs` and is worth nothing unless
  # something runs it on every PR. Until this job existed, `vaultqa-example`'s equivalent
  # check had been green locally and unrun in CI.
  #
  # `--all-targets` so `tests/integration.rs` is compiled and run; it drives the real
  # binary with `--mock`, so there is no network and no model in any of it.
  eval:
    name: eval (build, test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-eval-${{ hashFiles('Cargo.lock') }}

      # `--locked`, as on the other two builds — see the bridge's release step.
      - name: Build
        run: cargo build -p jesse-eval --locked

      # This is the teeth check. `product_v1_{direct,cli}_{good,bad}_mock_*` are four of the
      # tests it runs, and between them they are the claim that the suite's assertions catch
      # exactly the defects they name — on both drivers.
      - name: Test
        run: cargo test -p jesse-eval --all-targets

      - name: Clippy
        run: cargo clippy -p jesse-eval --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -p jesse-eval --check

  bridge:
    name: bridge (build, test, clippy, guards, audit, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      # Full history, NOT the default depth-1: scripts/version-guard.sh derives its
      # diff base from the merge base with origin/main, and at depth 1 there is no
      # history to derive it from. That is not a hypothetical — the guard silently
      # skipped every CI run it was ever part of, logging "no diff base" and passing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bridge/Cargo.lock') }}

      # The SERVING binary, built exactly as a deploy builds it: without
      # `containment-probe`. The probe prompts, the battery runner and its loopback
      # listener are not compiled into the bridge that answers turns, and this step is
      # what keeps that true — if the probe module ever leaks onto the always-compiled
      # path, this build is where it shows up.
      # `--locked` IS LOAD-BEARING, and it is here because its absence cost a deploy.
      #
      # The deploy builds with `cargo build --release --locked`; CI built without it. So a
      # commit whose `Cargo.lock` disagreed with its `Cargo.toml` — a version bumped in one
      # and not the other — went green here, merged, and then failed at the deploy's build
      # step with "cannot update the lock file ... because --locked was passed". The only
      # thing in the system that could catch it was the last thing to run.
      #
      # A CI build that silently REPAIRS the lock is not testing what ships. This makes the
      # two builds ask the same question.
      - name: Build (release)
        run: cargo build --release --locked

      # Tests and lints DO enable the feature, so the probe module and the containment
      # record's consistency checks (tests/containment.rs, which requires the feature to
      # read the probe table) are gated on every merge. The live battery inside that file
      # stays `#[ignore]`d — it spawns real agent turns.
      - name: Test
        run: cargo test --features containment-probe

      - name: Clippy
        run: cargo clippy --all-targets --features containment-probe -- -D warnings

      # Formatting is enforced, not merely conventional. It sits AFTER build/test/clippy
      # for the same reason clippy sits after test: steps stop at the first failure, and a
      # reflowed line is the least useful thing to learn at the cost of not learning
      # whether the tests passed.
      #
      # This gate exists because the crate had drifted out of `cargo fmt` shape entirely
      # (41 files across both crates, reformatted in bf8225f). The cost of that drift was
      # paid by every unrelated PR, which had to choose between carrying reformat noise
      # through files it never touched or hand-reverting rustfmt after each run. Neither
      # is reviewable, so the drift is now a build failure instead of a judgement call.
      #
      # SCOPE: the bridge only. This job's `working-directory: bridge` means this step
      # cannot see the root workspace — `bridge/` is deliberately excluded from it (see the
      # root Cargo.toml), so one `cargo fmt` never covers both. The root workspace's two
      # members enforce their own formatting in the `agent` and `eval` jobs above.
      - name: Format check
        run: cargo fmt --all --check

      # Prebuilt binaries (no from-source compile): a dependency-CVE gate and the
      # coverage tool.
      - name: Install cargo-audit and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-llvm-cov

      # Fails the build on a known-vulnerable dependency (reqwest/ring/rustls are
      # in the graph). Currently clean — no advisories, no ignore list. If an
      # unpatchable transitive advisory ever surfaces, add it to an audited ignore
      # list (`cargo audit --ignore RUSTSEC-YYYY-NNNN`, or a `deny.toml`
      # `[advisories] ignore` block) with a note on why it isn't reachable here —
      # never silently pin to a vulnerable version.
      # A weekly scheduled run (audit.yml) covers advisories that land between
      # pushes.
      - name: Dependency CVE audit
        run: cargo audit

      # Report-only, non-gating: emit a coverage number so a floor can be chosen
      # later. Single-threaded to dodge the known fake-`claude` subprocess timing
      # flakes in the integration tests (STATUS §Q/§T1), and continue-on-error so
      # a coverage hiccup never blocks a merge.
      - name: Coverage (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "### bridge coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --summary-only -- --test-threads=1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install gitleaks
        working-directory: ${{ github.workspace }}
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Source guards (incl. R5 personal-infra + gitleaks)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-guards.sh
